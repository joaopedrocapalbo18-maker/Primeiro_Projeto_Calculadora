<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora</title>
  <meta name="description" content="Calculadora moderna com tema claro, tema escuro e histórico de cálculos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="app">

    <section class="calc" aria-label="Calculadora">

      <header class="calc-header">
        <h1>Calculadora</h1>

        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-label="Mudar para tema escuro"
        >
          🌙 <span>Tema escuro</span>
        </button>
      </header>

      <div class="screen" aria-label="Visor da calculadora">
        <div class="expr" id="expression" aria-live="polite"></div>
        <output class="value" id="display" aria-live="polite">0</output>
      </div>

      <div class="keys" id="keys">
        <button type="button" class="fn" data-action="clear">AC</button>
        <button type="button" class="fn" data-action="sign">+/−</button>
        <button type="button" class="fn" data-action="percent">%</button>
        <button type="button" class="op" data-operator="/">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="op" data-operator="*">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" class="op" data-operator="-">−</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" class="op" data-operator="+">+</button>

        <button type="button" class="fn" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal">,</button>
        <button type="button" class="eq" data-action="equals">=</button>
      </div>

      <p class="keyboard-hint">
        Você também pode usar o teclado do computador.
      </p>
    </section>

    <aside class="panel" aria-label="Histórico de cálculos">
      <header class="panel-header">
        <div>
          <h2>Contas Anteriores</h2>
          <p class="panel-subtitle">Seus cálculos recentes</p>
        </div>

        <button type="button" class="clear-hist" id="clearHistory">
          Limpar
        </button>
      </header>

      <ul id="history" aria-live="polite">
        <li class="empty">Seus cálculos aparecerão aqui.</li>
      </ul>
    </aside>

  </main>
</body>
</html>
